[project]
name = "parallax-backend"
version = "0.1.0"
description = "Parallax Politics agentic backend (FastAPI + OpenRouter + EXA)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "arq>=0.26.1",
    "openai>=1.50.0",
    "exa-py>=1.4.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "bcrypt>=4.2.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    "orjson>=3.10.7",
    "sse-starlette>=2.1.3",
    "scrapling>=0.4.12,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "aiosqlite>=0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert (used in tests)
    "B008",   # FastAPI Depends() in defaults
    "S105",   # JWT field names trip the secret heuristic
    "S324",   # sha1 used as cache key, not security
    "N811",   # PgUUID alias is intentional
    "N818",   # Exa exception names without Error suffix is fine
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode in prose/prompts is OK
    "E501",   # line length handled by formatter
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
